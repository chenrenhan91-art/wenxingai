workflows:
  ios-workflow:
    name: iOS App Store Build
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: codemagic

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.chenrenhan.wenxingai

      vars:
        XCODE_WORKSPACE: "App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.chenrenhan.wenxingai"

      node: 22.11.0
      xcode: latest

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: Install npm dependencies
        script: |
          npm install

      - name: Build web assets
        script: |
          npm run build

      - name: Ensure iOS platform exists
        script: |
          npx cap add ios || true

      - name: Sync Capacitor to iOS
        script: |
          npx cap sync ios

      - name: Install CocoaPods (auto-detect Podfile)
        script: |
          set -e
          echo "Searching for Podfile..."
          if [ -f "ios/Podfile" ]; then
            echo "Found Podfile at ios/Podfile"
            cd ios
          elif [ -f "ios/App/Podfile" ]; then
            echo "Found Podfile at ios/App/Podfile"
            cd ios/App
          elif [ -f "ios/App/App/Podfile" ]; then
            echo "Found Podfile at ios/App/App/Podfile"
            cd ios/App/App
          else
            echo "Podfile NOT found. Listing ios directory:"
            ls -la ios || true
            echo "Finding Podfile under project root:"
            find . -maxdepth 5 -name Podfile -print || true
            exit 1
          fi
          pod install

      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

      - name: Add certificates to keychain
        script: |
          keychain add-certificates

      - name: Use provisioning profiles
        script: |
          xcode-project use-profiles

      - name: Increment build number (auto-detect iOS project dir)
        script: |
          set -e
          if [ -d "ios/App" ]; then
            cd ios/App
          elif [ -d "ios" ]; then
            cd ios
          else
            echo "iOS directory not found"
            exit 1
          fi
          agvtool new-version -all $BUILD_NUMBER

      - name: Build ipa (auto-detect workspace location)
        script: |
          set -e
          # Prefer the common Capacitor location: ios/App
          if [ -f "ios/App/$XCODE_WORKSPACE" ]; then
            cd ios/App
          elif [ -f "ios/$XCODE_WORKSPACE" ]; then
            cd ios
          elif [ -f "ios/App/App.xcworkspace" ]; then
            cd ios/App
            export XCODE_WORKSPACE="App.xcworkspace"
          else
            echo "Workspace not found. Listing possible workspaces:"
            find ios -maxdepth 4 -name "*.xcworkspace" -print || true
            exit 1
          fi

          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - ios/**/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
