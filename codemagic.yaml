workflows:
  ios-workflow:
    name: iOS App Store Build
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: codemagic

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.chenrenhan.wenxingai

      vars:
        XCODE_WORKSPACE: "App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.chenrenhan.wenxingai"

      node: 22.11.0
      xcode: latest

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: Show project root info
        script: |
          set -e
          echo "CM_BUILD_DIR=$CM_BUILD_DIR"
          pwd
          ls -la

      - name: Install npm dependencies
        script: |
          npm install

      - name: Build web assets
        script: |
          npm run build

      # 关键：如果 ios 目录不完整/没有 Podfile，就删掉重建，避免“空 ios 目录”卡死
      - name: Recreate iOS platform if Podfile missing
        script: |
          set -e
          if [ -d "ios" ]; then
            echo "ios directory exists. Checking for Podfile..."
            if ! find ios -maxdepth 6 -iname Podfile | grep -q Podfile; then
              echo "No Podfile under ios/. Recreating ios platform..."
              rm -rf ios
            fi
          fi

          if [ ! -d "ios" ]; then
            echo "Adding iOS platform..."
            npx cap add ios
          fi

      - name: Sync Capacitor to iOS
        script: |
          npx cap sync ios

      - name: Install CocoaPods (find Podfile and run pod install)
        script: |
          set -e
          echo "Listing ios folder:"
          ls -la ios || true
          echo "Searching Podfile under ios (case-insensitive):"
          PODFILE_PATH="$(find ios -maxdepth 6 -iname Podfile -print | head -n 1 || true)"
          echo "PODFILE_PATH=$PODFILE_PATH"

          if [ -z "$PODFILE_PATH" ]; then
            echo "Podfile STILL not found. Full search (maxdepth 8):"
            find . -maxdepth 8 -iname Podfile -print || true
            exit 1
          fi

          POD_DIR="$(dirname "$PODFILE_PATH")"
          echo "Running pod install in: $POD_DIR"
          cd "$POD_DIR"
          pod install

      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

      - name: Add certificates to keychain
        script: |
          keychain add-certificates

      - name: Use provisioning profiles
        script: |
          xcode-project use-profiles

      - name: Increment build number
        script: |
          set -e
          # 常见路径：ios/App
          if [ -d "ios/App" ]; then
            cd ios/App
          else
            cd ios
          fi
          agvtool new-version -all $BUILD_NUMBER

      - name: Build ipa
        script: |
          set -e
          # workspace 常见路径：ios/App/App.xcworkspace
          if [ -f "ios/App/$XCODE_WORKSPACE" ]; then
            cd ios/App
          elif [ -f "ios/$XCODE_WORKSPACE" ]; then
            cd ios
          else
            echo "Workspace not found. Search xcworkspace:"
            find ios -maxdepth 6 -name "*.xcworkspace" -print || true
            exit 1
          fi

          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - ios/**/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
