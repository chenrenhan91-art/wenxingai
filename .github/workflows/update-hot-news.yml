name: Update Hot News

on:
  push:
    branches:
      - main
    paths:
      - "scripts/update_hot_news.py"
      - "scripts/generate_daily_content.py"
      - "scripts/distribute_daily_content.py"
      - "hot-news-sources.json"
      - "prompts/gemini_daily_content_prompt.txt"
      - "BUFFER_SETUP.md"
      - ".github/workflows/update-hot-news.yml"
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-hot-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run updater
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}
        run: python3 scripts/update_hot_news.py

      - name: Generate Gemini content package
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: python3 scripts/generate_daily_content.py

      - name: Prepare social distribution
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_THREADS_PROFILE_ID: ${{ vars.BUFFER_THREADS_PROFILE_ID }}
          BUFFER_X_PROFILE_ID: ${{ vars.BUFFER_X_PROFILE_ID }}
          BUFFER_FACEBOOK_PROFILE_ID: ${{ vars.BUFFER_FACEBOOK_PROFILE_ID }}
          BUFFER_INSTAGRAM_PROFILE_ID: ${{ vars.BUFFER_INSTAGRAM_PROFILE_ID }}
          SOCIAL_LANDING_URL: ${{ vars.SOCIAL_LANDING_URL }}
        run: python3 scripts/distribute_daily_content.py

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hot-news-data.json index.html mingli-xuanxue-news.html sitemap.xml
          if [ -f generated/gemini-content-bundle.json ]; then git add generated/gemini-content-bundle.json; fi
          if [ -f generated/gemini-content-package.md ]; then git add generated/gemini-content-package.md; fi
          if [ -f generated/distribution-jobs.json ]; then git add generated/distribution-jobs.json; fi
          if [ -f generated/distribution-package.md ]; then git add generated/distribution-package.md; fi
          if [ -f generated/distribution-state.json ]; then git add generated/distribution-state.json; fi
          if [ -d generated/social-posts ]; then git add generated/social-posts; fi
          git commit -m "chore: update hot news"
          git push
